name: Build Tweak Dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'tweak/**'
      - '.github/workflows/build-tweak.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid dpkg 2>/dev/null || true
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -L -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -r /tmp/sdks-master/iPhoneOS*.sdk "$HOME/theos/sdks/" || true
          ls "$HOME/theos/sdks"

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          cd tweak
          make clean 2>/dev/null || true
          make -j4

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: xh-dylib
          path: |
            tweak/.theos/obj/xh.dylib
            tweak/.theos/obj/**/*.dylib
          if-no-files-found: error
